<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Little Log</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #FBF2F6;
    --card: #FFFFFF;
    --ink: #4A2E3D;
    --ink-soft: #8B6B7A;
    --rose: #E08CA6;
    --rose-deep: #C96C87;
    --sage: #B9A6D9;
    --sage-deep: #9A82C4;
    --line: #F3DEE8;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background: var(--bg);
    color: var(--ink);
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
    display:flex;
    justify-content:center;
    padding: 20px 14px 40px;
  }
  .app{ width:100%; max-width:460px; }

  header{ text-align:center; margin: 10px 0 22px; }
  header h1{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size: 30px;
    margin: 0 0 4px;
    letter-spacing: -0.01em;
  }
  header p{ margin:0; color:var(--ink-soft); font-size:14px; }

  .bow{ vertical-align:-5px; margin-right:7px; }

  .today-header{ display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; }
  .today-title{ font-family:'Fraunces', serif; font-weight:600; font-size:17px; }
  .refresh-btn{
    background:none; border:none; color:var(--ink-soft); font-size:15px; cursor:pointer;
    padding:4px 9px; border-radius:8px; line-height:1;
  }
  .refresh-btn:active{ background: var(--line); }
  .refresh-btn.spinning{ animation: spin 0.6s linear; }
  @keyframes spin{ from{transform:rotate(0deg);} to{transform:rotate(360deg);} }

  .stats-row{ display:flex; gap:8px; margin-bottom:14px; }
  .stat-pill{
    flex:1; background:var(--bg); border:1px solid var(--line); border-radius:14px;
    padding:10px 8px; text-align:center;
  }
  .stat-pill .num{
    font-family:'Fraunces', serif; font-weight:700; font-size:18px; color:var(--rose-deep); display:block;
  }
  .stat-pill .lbl{ font-size:10.5px; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.03em; }

  .feed-table{ width:100%; border-collapse:collapse; font-size:13px; }
  .feed-table th{
    text-align:left; font-size:10px; text-transform:uppercase; letter-spacing:.03em;
    color:var(--ink-soft); padding:0 6px 6px; font-weight:600;
  }
  .feed-table td{ padding:9px 6px; border-top:1px solid var(--line); vertical-align:top; }
  .feed-table tr:first-child td{ border-top:none; }
  .feed-table td.time-cell{ color:var(--ink-soft); white-space:nowrap; font-size:12.5px; }

  .diaper-pill{
    display:inline-block; font-size:10.5px; padding:2px 8px; border-radius:100px;
    margin-right:3px; margin-bottom:3px; white-space:nowrap;
  }
  .diaper-pill.pee{ background:#FFF3D6; color:#9A7B23; }
  .diaper-pill.poop{ background:#EDE3F7; color:#6B5296; }
  .diaper-dash{ color: var(--ink-soft); }

  .empty-state{ text-align:center; padding: 16px 10px 6px; color:var(--ink-soft); font-size:13.5px; line-height:1.5; }

  .card{
    background: var(--card);
    border-radius: 20px;
    padding: 18px 18px 20px;
    box-shadow: 0 1px 2px rgba(54,42,64,0.06), 0 8px 24px rgba(54,42,64,0.06);
    margin-bottom: 16px;
    border: 1px solid var(--line);
  }

  /* Chip tracker */
  .chips{ display:flex; flex-wrap:wrap; gap:7px; }
  .chip{
    font-size: 12.5px;
    padding: 6px 11px;
    border-radius: 100px;
    border: 1px solid var(--line);
    color: var(--ink-soft);
    background: #FAF9FC;
    transition: all .25s ease;
  }
  .chip.filled{
    background: var(--sage);
    border-color: var(--sage);
    color: white;
    font-weight: 600;
  }

  /* Conversation */
  .log{
    max-height: 260px;
    overflow-y:auto;
    display:flex;
    flex-direction:column;
    gap:10px;
    margin-bottom: 14px;
    padding-right: 2px;
  }
  .msg{ font-size:14.5px; line-height:1.45; padding:10px 13px; border-radius:14px; max-width: 88%; }
  .msg.user{ align-self:flex-end; background: var(--sage); color:white; border-bottom-right-radius:4px; }
  .msg.bot{ align-self:flex-start; background:#F4F0F8; color:var(--ink); border-bottom-left-radius:4px; }
  .msg.system{ align-self:center; color: var(--ink-soft); font-size:12.5px; font-style:italic; }

  /* Mic control */
  .mic-row{ display:flex; flex-direction:column; align-items:center; gap:10px; margin: 6px 0 4px; }
  .mic-btn{
    width: 78px; height:78px; border-radius:50%;
    background: var(--rose);
    border:none;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
    box-shadow: 0 6px 18px rgba(201,123,132,0.4);
    transition: transform .15s ease, box-shadow .15s ease;
  }
  .mic-btn:active{ transform: scale(0.94); }
  .mic-btn.listening{
    background: var(--rose-deep);
    animation: pulse 1.4s ease-in-out infinite;
  }
  @keyframes pulse{
    0%{ box-shadow: 0 0 0 0 rgba(201,123,132,0.5); }
    70%{ box-shadow: 0 0 0 22px rgba(201,123,132,0); }
    100%{ box-shadow: 0 0 0 0 rgba(201,123,132,0); }
  }
  .mic-status{ font-size:13px; color: var(--ink-soft); }

  .type-row{ display:flex; gap:8px; margin-top:12px; }
  .type-row input{
    flex:1; border:1px solid var(--line); border-radius:12px; padding:10px 12px;
    font-family:'Inter'; font-size:14px; color:var(--ink); background:#FAF9FC;
  }
  .type-row button{
    border:none; background:var(--ink); color:white; border-radius:12px;
    padding:0 16px; font-family:'Inter'; font-weight:600; font-size:13.5px; cursor:pointer;
  }

  /* Review card */
  .review-grid{ display:grid; grid-template-columns: 1fr 1fr; gap:10px 12px; margin-bottom:14px;}
  .field{ display:flex; flex-direction:column; gap:4px; }
  .field label{ font-size:11.5px; color:var(--ink-soft); font-weight:600; text-transform:uppercase; letter-spacing:.03em; }
  .field input, .field select{
    border:1px solid var(--line); border-radius:10px; padding:8px 10px;
    font-family:'Inter'; font-size:13.5px; color:var(--ink); background:#FAF9FC;
  }
  .field.wide{ grid-column: 1 / -1; }

  .btn-row{ display:flex; gap:10px; }
  .btn{
    flex:1; border:none; border-radius:12px; padding:12px; font-family:'Inter';
    font-weight:700; font-size:14.5px; cursor:pointer;
  }
  .btn.save{ background: var(--sage-deep); color:white; }
  .btn.discard{ background:#F4F0F8; color: var(--ink-soft); }

  .setup{ font-size:13px; color:var(--ink-soft); }
  .setup input{
    width:100%; margin-top:6px; border:1px solid var(--line); border-radius:10px;
    padding:9px 11px; font-family:'Inter'; font-size:13.5px; background:#FAF9FC; color:var(--ink);
  }
  .setup button{
    margin-top:10px; width:100%; border:none; background:var(--ink); color:white;
    border-radius:10px; padding:10px; font-weight:600; font-size:13.5px; cursor:pointer;
  }
  .toast{
    text-align:center; font-size:13px; color: var(--sage-deep); font-weight:600; margin-top:8px; min-height:16px;
  }
  .new-btn{
    display:block; width:100%; text-align:center; margin-top:6px; padding:10px;
    border-radius:12px; border:1px solid var(--line); background:transparent;
    color:var(--ink-soft); font-family:'Inter'; font-size:13.5px; cursor:pointer;
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1><svg class="bow" width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M12 12.5 L3 6.5 Q0.5 5 1 8.5 Q1.3 11 3.5 12.5 Q1.3 14 1 16.5 Q0.5 20 3 18.5 Z" fill="var(--rose)"/>
      <path d="M12 12.5 L21 6.5 Q23.5 5 23 8.5 Q22.7 11 20.5 12.5 Q22.7 14 23 16.5 Q23.5 20 21 18.5 Z" fill="var(--rose-deep)"/>
      <circle cx="12" cy="12.5" r="2.6" fill="var(--rose-deep)"/>
    </svg>Little Log</h1>
    <p>Tap, talk, and it's on the sheet.</p>
    <a href="#" id="settingsLink" style="display:block; margin-top:6px; font-size:12.5px; color:var(--ink-soft); text-decoration:underline;">Setup / change webhook URL</a>
  </header>

  <div class="card" id="todayCard">
    <div class="today-header">
      <div class="today-title">Today so far</div>
      <button class="refresh-btn" id="refreshTodayBtn" aria-label="Refresh today's feeds">↻ Refresh</button>
    </div>
    <div class="stats-row" id="statsRow"></div>
    <div id="tableWrap"><div class="empty-state">Loading today's feeds…</div></div>
  </div>

  <div class="card" id="setupCard" style="display:none;">
    <div class="setup">
      One-time setup — paste the Web app URL from your Apps Script deployment, and the secret you set in the script.
      <input id="webhookInput" placeholder="https://script.google.com/macros/s/.../exec">
      <input id="secretInput" placeholder="Your secret password" style="margin-top:8px;">
      <button id="saveSetupBtn">Save setup</button>
    </div>
  </div>

  <div class="card">
    <div class="chips" id="chips"></div>
  </div>

  <div class="card">
    <div class="log" id="log"></div>

    <div class="mic-row">
      <button class="mic-btn" id="micBtn" aria-label="Start talking">
        <svg width="30" height="30" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M12 15a3 3 0 003-3V6a3 3 0 10-6 0v6a3 3 0 003 3z" fill="white"/>
          <path d="M19 11a1 1 0 00-2 0 5 5 0 01-10 0 1 1 0 00-2 0 7 7 0 006 6.93V20H9a1 1 0 100 2h6a1 1 0 100-2h-2v-2.07A7 7 0 0019 11z" fill="white"/>
        </svg>
      </button>
      <div class="mic-status" id="micStatus">Tap the mic and tell me about the feed</div>
    </div>

    <div class="type-row">
      <input id="typeInput" placeholder="...or type it instead">
      <button id="typeSendBtn">Send</button>
    </div>
  </div>

  <div class="card" id="reviewCard" style="display:none;">
    <div style="font-family:'Fraunces'; font-weight:600; font-size:17px; margin-bottom:12px;">Quick check before I save this</div>
    <div class="review-grid" id="reviewGrid"></div>
    <div class="btn-row">
      <button class="btn discard" id="discardBtn">Discard</button>
      <button class="btn save" id="saveBtn">Save to sheet</button>
    </div>
    <div class="toast" id="toast"></div>
  </div>

  <button class="new-btn" id="newEntryBtn" style="display:none;">Start a new entry</button>
</div>

<script>
const FIELD_DEFS = [
  {key:'date', label:'Date', type:'date'},
  {key:'time', label:'Time', type:'text'},
  {key:'left_breast', label:'Left (min)', type:'number'},
  {key:'right_breast', label:'Right (min)', type:'number'},
  {key:'formula', label:'Formula (ml)', type:'number'},
  {key:'breast_milk', label:'Breast milk (ml)', type:'number'},
  {key:'pump_output', label:'Pump output (ml)', type:'number'},
  {key:'pee', label:'Pee', type:'select', options:['None','Light','Medium','Heavy']},
  {key:'poop', label:'Poop', type:'select', options:['None','Light','Medium','Heavy']},
  {key:'poop_color', label:'Poop color', type:'text'},
  {key:'notes', label:'Notes', type:'text', wide:true},
];

let collected = {};
let awaitingConfirmation = false;
let webhookUrl = null;
let secret = null;
let recognizing = false;
let recognition = null;

const chipsEl = document.getElementById('chips');
const logEl = document.getElementById('log');
const micBtn = document.getElementById('micBtn');
const micStatus = document.getElementById('micStatus');
const typeInput = document.getElementById('typeInput');
const reviewCard = document.getElementById('reviewCard');
const reviewGrid = document.getElementById('reviewGrid');
const newEntryBtn = document.getElementById('newEntryBtn');
const setupCard = document.getElementById('setupCard');

function pacificNowParts(){
  const now = new Date();
  const date = new Intl.DateTimeFormat('en-CA', {timeZone:'America/Los_Angeles', year:'numeric', month:'2-digit', day:'2-digit'}).format(now);
  const time = new Intl.DateTimeFormat('en-US', {timeZone:'America/Los_Angeles', hour:'numeric', minute:'2-digit', hour12:true}).format(now);
  return {date, time};
}

function renderChips(){
  chipsEl.innerHTML = '';
  FIELD_DEFS.forEach(f => {
    const has = collected[f.key] !== undefined && collected[f.key] !== '' && collected[f.key] !== 0 && collected[f.key] !== null;
    const chip = document.createElement('div');
    chip.className = 'chip' + (has ? ' filled' : '');
    chip.textContent = f.label;
    chipsEl.appendChild(chip);
  });
}

function addMsg(role, text){
  const div = document.createElement('div');
  div.className = 'msg ' + role;
  div.textContent = text;
  logEl.appendChild(div);
  logEl.scrollTop = logEl.scrollHeight;
}

function speak(text){
  try{
    const u = new SpeechSynthesisUtterance(text);
    u.rate = 1.02;
    speechSynthesis.speak(u);
  }catch(e){}
}

function loadSetup(){
  try{
    webhookUrl = localStorage.getItem('webhook_url');
    secret = localStorage.getItem('webhook_secret');
  }catch(e){}
  if(!webhookUrl || !secret){
    setupCard.style.display = 'block';
  }
}

document.getElementById('saveSetupBtn').onclick = () => {
  const w = document.getElementById('webhookInput').value.trim();
  const s = document.getElementById('secretInput').value.trim();
  if(!w || !s){
    alert('Please fill in both the Web app URL and the secret.');
    return;
  }
  try{
    localStorage.setItem('webhook_url', w);
    localStorage.setItem('webhook_secret', s);
  }catch(e){}
  webhookUrl = w; secret = s;
  setupCard.style.display = 'none';
  loadTodayFeeds();
};

async function processInput(userText){
  addMsg('user', userText);
  micStatus.textContent = 'Thinking...';

  if(!webhookUrl || !secret){
    setupCard.style.display = 'block';
    micStatus.textContent = 'Tap the mic and tell me about the feed';
    return;
  }

  try{
    const resp = await fetch(webhookUrl, {
      method: 'POST',
      headers: {'Content-Type': 'text/plain;charset=utf-8'},
      body: JSON.stringify({ secret, action: 'parse', transcript: userText, collected, awaiting_confirmation: awaitingConfirmation })
    });
    const data = await resp.json();
    if(data.status !== 'success') throw new Error(data.message || 'parse failed');

    collected = Object.assign({}, collected, data.fields || {});
    awaitingConfirmation = !!data.awaiting_confirmation;
    renderChips();
    addMsg('bot', data.reply);
    speak(data.reply);

    if(data.done){
      openReview();
    } else {
      micStatus.textContent = 'Tap the mic and tell me about the feed';
    }
  }catch(e){
    addMsg('system', "Parser error: " + (e.message || e) + " — check the Apps Script Executions log for details.");
    micStatus.textContent = 'Tap the mic and tell me about the feed';
  }
}

function openReview(){
  reviewGrid.innerHTML = '';
  FIELD_DEFS.forEach(f => {
    const wrap = document.createElement('div');
    wrap.className = 'field' + (f.wide ? ' wide' : '');
    const label = document.createElement('label');
    label.textContent = f.label;
    wrap.appendChild(label);

    let input;
    if(f.type === 'select'){
      input = document.createElement('select');
      f.options.forEach(o => {
        const opt = document.createElement('option');
        opt.value = o; opt.textContent = o;
        if((collected[f.key] || 'None') === o) opt.selected = true;
        input.appendChild(opt);
      });
    } else {
      input = document.createElement('input');
      input.type = f.type;
      input.value = collected[f.key] !== undefined ? collected[f.key] : (f.type === 'number' ? 0 : '');
    }
    input.dataset.key = f.key;
    wrap.appendChild(input);
    reviewGrid.appendChild(wrap);
  });
  reviewCard.style.display = 'block';
  reviewCard.scrollIntoView({behavior:'smooth', block:'start'});
}

document.getElementById('discardBtn').onclick = () => resetSession();

document.getElementById('saveBtn').onclick = async () => {
  const payload = { secret };
  reviewGrid.querySelectorAll('input, select').forEach(el => {
    const key = el.dataset.key;
    const def = FIELD_DEFS.find(f => f.key === key);
    payload[key] = def.type === 'number' ? (parseFloat(el.value) || 0) : el.value;
  });

  const toast = document.getElementById('toast');
  toast.textContent = 'Saving...';
  toast.style.color = 'var(--ink-soft)';

  try{
    await fetch(webhookUrl, {
      method: 'POST',
      headers: {'Content-Type': 'text/plain;charset=utf-8'},
      body: JSON.stringify(payload)
    });
    toast.textContent = 'Saved to the sheet 🌿';
    toast.style.color = 'var(--sage-deep)';
    speak("Saved. Nice work.");
    loadTodayFeeds();
    setTimeout(resetSession, 1400);
  }catch(e){
    toast.textContent = "Couldn't reach the sheet — check your setup.";
    toast.style.color = 'var(--rose-deep)';
  }
};

function resetSession(){
  collected = {};
  awaitingConfirmation = false;
  logEl.innerHTML = '';
  reviewCard.style.display = 'none';
  newEntryBtn.style.display = 'none';
  renderChips();
  addMsg('system', 'Ready for the next one.');
  micStatus.textContent = 'Tap the mic and tell me about the feed';
}

// --- Voice input ---
const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
if(SpeechRecognition){
  recognition = new SpeechRecognition();
  recognition.lang = 'en-US';
  recognition.interimResults = false;
  recognition.maxAlternatives = 1;

  recognition.onstart = () => {
    recognizing = true;
    micBtn.classList.add('listening');
    micStatus.textContent = 'Listening...';
  };
  recognition.onerror = () => {
    recognizing = false;
    micBtn.classList.remove('listening');
    micStatus.textContent = 'Tap the mic and tell me about the feed';
  };
  recognition.onend = () => {
    recognizing = false;
    micBtn.classList.remove('listening');
  };
  recognition.onresult = (e) => {
    const transcript = e.results[0][0].transcript;
    processInput(transcript);
  };
} else {
  micStatus.textContent = 'Voice not supported here — type below instead';
  micBtn.style.opacity = '0.4';
}

micBtn.onclick = () => {
  if(!recognition) return;
  if(recognizing){ recognition.stop(); return; }
  try{ recognition.start(); }catch(e){}
};

document.getElementById('typeSendBtn').onclick = () => {
  const val = typeInput.value.trim();
  if(!val) return;
  typeInput.value = '';
  processInput(val);
};
typeInput.addEventListener('keydown', (e) => {
  if(e.key === 'Enter') document.getElementById('typeSendBtn').click();
});

function timeToMinutes(str){
  const m = String(str).match(/(\d+):(\d+)\s*(AM|PM)/i);
  if(!m) return null;
  let h = parseInt(m[1], 10) % 12;
  if(/pm/i.test(m[3])) h += 12;
  return h * 60 + parseInt(m[2], 10);
}

function feedSummary(e){
  const parts = [];
  if(e.left_breast) parts.push(e.left_breast + 'm L');
  if(e.right_breast) parts.push(e.right_breast + 'm R');
  if(e.formula) parts.push(e.formula + 'ml formula');
  if(e.breast_milk) parts.push(e.breast_milk + 'ml milk');
  if(e.pump_output) parts.push(e.pump_output + 'ml pumped');
  return parts.length ? parts.join(', ') : '<span class="diaper-dash">—</span>';
}

function diaperSummary(e){
  const pills = [];
  if(e.pee && e.pee !== 'None') pills.push('<span class="diaper-pill pee">' + e.pee + ' wet</span>');
  if(e.poop && e.poop !== 'None') pills.push('<span class="diaper-pill poop">' + e.poop + (e.poop_color ? ' · ' + e.poop_color : '') + '</span>');
  return pills.length ? pills.join('') : '<span class="diaper-dash">—</span>';
}

function renderToday(entries){
  const statsRow = document.getElementById('statsRow');
  const tableWrap = document.getElementById('tableWrap');
  const count = entries.length;

  let lastFedLabel = '—';
  if(count > 0){
    const nowMin = timeToMinutes(pacificNowParts().time);
    const lastMin = timeToMinutes(entries[0].time);
    if(nowMin !== null && lastMin !== null){
      let diff = nowMin - lastMin;
      if(diff < 0) diff += 24 * 60;
      if(diff < 1) lastFedLabel = 'just now';
      else if(diff < 60) lastFedLabel = diff + 'm ago';
      else lastFedLabel = Math.floor(diff / 60) + 'h ' + (diff % 60) + 'm ago';
    }
  }

  statsRow.innerHTML =
    '<div class="stat-pill"><span class="num">' + count + '</span><span class="lbl">Feeds today</span></div>' +
    '<div class="stat-pill"><span class="num">' + lastFedLabel + '</span><span class="lbl">Last fed</span></div>';

  if(count === 0){
    tableWrap.innerHTML = '<div class="empty-state">No feeds logged yet today — you\'ve got this 💛</div>';
    return;
  }

  const rows = entries.map(e =>
    '<tr><td class="time-cell">' + e.time + '</td>' +
    '<td>' + feedSummary(e) + '</td>' +
    '<td>' + diaperSummary(e) + '</td></tr>'
  ).join('');

  tableWrap.innerHTML =
    '<table class="feed-table"><thead><tr><th>Time</th><th>Fed</th><th>Diaper</th></tr></thead>' +
    '<tbody>' + rows + '</tbody></table>';
}

async function loadTodayFeeds(){
  if(!webhookUrl || !secret){
    document.getElementById('tableWrap').innerHTML = '<div class="empty-state">Finish setup above to see today\'s feeds here.</div>';
    return;
  }
  try{
    const resp = await fetch(webhookUrl, {
      method: 'POST',
      headers: {'Content-Type': 'text/plain;charset=utf-8'},
      body: JSON.stringify({ secret, action: 'today' })
    });
    const data = await resp.json();
    if(data.status !== 'success') throw new Error(data.message);
    renderToday(data.entries || []);
  }catch(e){
    document.getElementById('tableWrap').innerHTML = '<div class="empty-state">Couldn\'t load today\'s feeds right now.</div>';
  }
}

document.getElementById('refreshTodayBtn').onclick = (evt) => {
  evt.currentTarget.classList.add('spinning');
  loadTodayFeeds().finally(() => evt.currentTarget.classList.remove('spinning'));
};

document.getElementById('settingsLink').onclick = (evt) => {
  evt.preventDefault();
  document.getElementById('webhookInput').value = webhookUrl || '';
  document.getElementById('secretInput').value = secret || '';
  setupCard.style.display = 'block';
  setupCard.scrollIntoView({behavior:'smooth', block:'start'});
};

renderChips();
loadSetup();
loadTodayFeeds();
addMsg('system', 'Tap the mic and tell me about the feed.');
</script>
</body>
</html>
